<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistente de Orações</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            color: #2c3e50;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #d4af37;
            padding-bottom: 10px;
            width: 100%;
            max-width: 600px;
        }

        header h1 {
            color: #003366;
            margin: 0;
            font-variant: small-caps;
        }

        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border-left: 5px solid #003366;
            transition: transform 0.2s;
            display: flex;
            flex-direction: column;
        }

        .card-img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-bottom: 1px solid #eee;
        }

        .card-content {
            padding: 20px;
        }

        .card:hover {
            transform: translateY(-2px);
        }

        .card h3 {
            margin-top: 0;
            color: #003366;
            font-size: 1.2rem;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
            font-size: 0.9rem;
        }

        .btn-hoje { background-color: #003366; color: white; }
        .btn-ontem { background-color: #d4af37; color: white; }
        .btn-unico { background-color: #2c3e50; color: white; }

        button:hover {
            filter: brightness(1.2);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .ad-slot {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px 0;
            min-height: 50px;
        }
        
        footer {
            margin-top: 40px;
            font-size: 0.8rem;
            color: #7f8c8d;
            text-align: center;
        }
    </style>
</head>
<body>

<header>
    <h1>Canais de Oração</h1>
    <p>Assista às celebrações do dia</p>
</header>

<div class="container" id="cards-container">
    <p style="text-align: center;">Carregando orações...</p>
</div>

<footer>
    <p>Que a paz de Cristo esteja com você.</p>
</footer>

<script>
    // Cole aqui o link obtido ao "Publicar na Web" como CSV na planilha
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRUImoAtZ4E2g_fLMqCTh4lxQyAOLaHidHq6yIITwLOHL2s1TROu866CksJmtWvrFLnGrWHbCzKMiY4/pub?gid=0&single=true&output=csv';

    // Bloco do anúncio Adsterra
    const adTemplate = `
        <div class="ad-slot">
            <script type="text/javascript">
                atOptions = {
                    'key' : 'f95477b41aad412b789767be6416723b',
                    'format' : 'iframe',
                    'height' : 50,
                    'width' : 320,
                    'params' : {}
                };
            <\/script>
            <script type="text/javascript" src="https://www.highperformanceformat.com/f95477b41aad412b789767be6416723b/invoke.js"><\/script>
        </div>
    `;

    function buscar(titulo, periodo) {
        const data = new Date();
        if (periodo === 'ontem') data.setDate(data.getDate() - 1);
        const dia = String(data.getDate()).padStart(2, '0');
        const mes = String(data.getMonth() + 1).padStart(2, '0');
        const ano = data.getFullYear();
        const dataFormatada = `${dia}/${mes}/${ano}`;
        const termoBusca = `${titulo} ${dataFormatada}`;
        const urlYoutube = `https://www.youtube.com/results?search_query=${encodeURIComponent(termoBusca)}`;
        window.open(urlYoutube, '_blank');
    }

    // Leitor de formato CSV para converter a planilha em objetos do JS
    function parseCSV(text) {
        const lines = text.trim().split(/\r\n|\n/);
        if (lines.length < 2) return [];

        const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, ''));
        const result = [];

        for (let i = 1; i < lines.length; i++) {
            if (!lines[i].trim()) continue;
            
            // Separa por vírgula respeitando campos com aspas
            const values = lines[i].match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || lines[i].split(',');
            const obj = {};
            
            headers.forEach((header, index) => {
                let val = values[index] ? values[index].trim() : '';
                val = val.replace(/^"|"$/g, ''); // Remove aspas extras
                obj[header] = val;
            });
            result.push(obj);
        }
        return result;
    }

    async function carregarCards() {
        const container = document.getElementById('cards-container');
        try {
            const response = await fetch(CSV_URL);
            const csvText = await response.text();
            const itens = parseCSV(csvText);

            if (itens.length === 0) {
                container.innerHTML = '<p style="text-align:center;">Nenhum card encontrado na planilha.</p>';
                return;
            }

            let htmlContent = adTemplate; // Adiciona o primeiro anúncio no topo

            itens.forEach((item) => {
                let botoesHTML = '';

                if (item.tipo && item.tipo.toLowerCase() === 'unico') {
                    botoesHTML = `<button class="btn-unico" onclick="window.open('${item.link_ou_termo}', '_blank')">Acessar Agora</button>`;
                } else {
                    botoesHTML = `
                        <button class="btn-hoje" onclick="buscar('${item.link_ou_termo}', 'hoje')">Hoje</button>
                        <button class="btn-ontem" onclick="buscar('${item.link_ou_termo}', 'ontem')">Ontem</button>
                    `;
                }

                htmlContent += `
                    <div class="card">
                        <img src="${item.imagem}" class="card-img" alt="${item.titulo}">
                        <div class="card-content">
                            <h3>${item.titulo}</h3>
                            <div class="buttons">
                                ${botoesHTML}
                            </div>
                        </div>
                    </div>
                    ${adTemplate}
                `;
            });

            container.innerHTML = htmlContent;
        } catch (erro) {
            console.error('Erro ao carregar os dados da planilha:', erro);
            container.innerHTML = '<p style="text-align:center; color:red;">Não foi possível carregar o conteúdo. Verifique o link da planilha no código.</p>';
        }
    }

    carregarCards();
</script>

</body>
</html>
